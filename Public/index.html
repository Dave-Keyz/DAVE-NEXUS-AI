<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAVE NEXUS AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #08080f;
      color: #f5f3ff;
      font-family: Arial, sans-serif;
      height: 100dvh;
      display: flex;
      justify-content: center;
    }
    .app {
      width: 100%;
      max-width: 800px;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 18px;
      border-bottom: 1px solid #242236;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(135deg, #9b5cff, #5424c7);
      font-weight: bold;
      font-size: 19px;
    }
    header h1 { margin: 0; font-size: 18px; }
    header p { margin: 5px 0 0; color: #aaa6bf; font-size: 12px; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .message {
      padding: 13px 15px;
      border-radius: 17px;
      max-width: 88%;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.5;
      font-size: 15px;
    }
    .bot {
      align-self: flex-start;
      background: #171624;
      border: 1px solid #29263d;
    }
    .user {
      align-self: flex-end;
      background: #6938cf;
      color: white;
    }
    form {
      padding: 12px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      display: flex;
      gap: 9px;
      border-top: 1px solid #242236;
      background: #0c0b15;
    }
    textarea {
      flex: 1;
      min-width: 0;
      max-height: 120px;
      resize: none;
      border: 1px solid #302b46;
      border-radius: 15px;
      padding: 13px;
      color: white;
      background: #171624;
      outline: none;
      font: inherit;
    }
    textarea:focus { border-color: #9660ff; }
    button {
      border: 0;
      border-radius: 14px;
      padding: 0 18px;
      background: #8952f5;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .5; }
    .note {
      text-align: center;
      color: #77738c;
      font-size: 11px;
      padding: 0 8px 8px;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">D</div>
      <div>
        <h1>DAVE NEXUS AI</h1>
        <p>Your intelligent AI assistant</p>
      </div>
    </header>

    <main id="chat" aria-live="polite">
      <div class="message bot">Hey! 👋 I'm DAVE NEXUS AI, created by Dave Keyz. What can I help you with today?</div>
    </main>

    <form id="form">
      <textarea id="input" rows="1" maxlength="4000"
        placeholder="Message DAVE NEXUS AI..." required></textarea>
      <button id="send" type="submit">Send</button>
    </form>
    <div class="note">DAVE NEXUS AI can make mistakes. Check important information.</div>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const messages = [];

    function addMessage(text, role) {
      const div = document.createElement("div");
      div.className = "message " + (role === "user" ? "user" : "bot");
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text || send.disabled) return;

      addMessage(text, "user");
      messages.push({ role: "user", content: text });
      input.value = "";
      input.style.height = "auto";
      send.disabled = true;
      send.textContent = "...";
      const loading = addMessage("DAVE NEXUS AI is thinking...", "assistant");

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages })
        });

        const data = await response.json();
        loading.remove();

        if (!response.ok) {
          addMessage(data.error || "Sorry, something went wrong.", "assistant");
        } else {
          addMessage(data.reply, "assistant");
          messages.push({ role: "assistant", content: data.reply });
          if (messages.length > 20) messages.splice(0, 2);
        }
      } catch (error) {
        loading.remove();
        addMessage("Couldn't connect to the server. Please try again.", "assistant");
      } finally {
        send.disabled = false;
        send.textContent = "Send";
        input.focus();
      }
    });

    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 120) + "px";
    });

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });
  </script>
</body>
</html>
